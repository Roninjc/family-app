# Example service definition to merge into the home server's docker-compose.
# The app sits behind the existing nginx reverse proxy, which terminates TLS.
# Requires a .env next to the compose file with:
#   PUBLIC_SUPABASE_URL, PUBLIC_SUPABASE_ANON_KEY
services:
  family-app:
    build:
      context: .
      args:
        PUBLIC_SUPABASE_URL: ${PUBLIC_SUPABASE_URL}
        PUBLIC_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY}
    # ORIGIN must match the public URL served by nginx, otherwise SvelteKit
    # form actions fail the cross-site POST check.
    environment:
      ORIGIN: https://familia.example.com
    restart: unless-stopped
    # If nginx runs in the same compose/network, drop `ports` and proxy to
    # http://family-app:3000 instead.
    ports:
      - '3000:3000'
