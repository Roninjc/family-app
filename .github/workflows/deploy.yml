name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: roninjc/family-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PUBLIC_ vars are inlined into the client bundle at build time
      # ($env/static/public), so they must be provided as build args.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:latest
          build-args: |
            PUBLIC_SUPABASE_URL=${{ secrets.PUBLIC_SUPABASE_URL }}
            PUBLIC_SUPABASE_ANON_KEY=${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy on server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker compose -f /home/jake/compose.yml pull family-app
            docker compose -f /home/jake/compose.yml up -d family-app
            container_id=$(docker compose -f /home/jake/compose.yml ps -q family-app)

            if [ -z "$container_id" ]; then
              echo 'family-app container was not created'
              docker compose -f /home/jake/compose.yml ps
              exit 1
            fi

            for attempt in $(seq 1 12); do
              health=$(docker inspect --format '{{.State.Health.Status}}' "$container_id" 2>/dev/null || true)
              echo "family-app health: ${health:-not-found} (attempt ${attempt}/12)"
              if [ "$health" = healthy ]; then
                break
              fi
              if [ "$health" = unhealthy ]; then
                docker logs --tail 200 "$container_id"
                exit 1
              fi
              sleep 5
            done

            if [ "$health" != healthy ]; then
              echo 'family-app did not become healthy within 60 seconds'
              docker logs --tail 200 "$container_id"
              exit 1
            fi

            docker image prune -f || true
